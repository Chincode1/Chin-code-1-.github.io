<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chin code</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- โหลด Google Font ภาษาไทย (Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Navbar: แถบเมนูด้านบน (ตัดเกี่ยวกับเราและบริการออกแล้ว) -->
    <nav class="bg-blue-950 text-white shadow-lg w-full sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                
                <!-- โลโก้ด้านซ้ายบน -->
                <div class="flex-shrink-0 flex items-center gap-3">
                    <img src="https://cdn.phototourl.com/free/2026-07-27-68e4eeba-1e55-46ed-b0eb-9a6779221a1f.png" width="100">
                    <span class="font-bold text-xl text-blue-400 tracking-wide">บริการเขียนเว็บไซต์</span>
                </div>

                <!-- เมนูด้านขวาบน -->
                <div class="flex items-center space-x-6">
                    <a href="#" class="text-slate-200 hover:text-blue-400 font-medium transition">หน้าแรก</a>
                    <a href="#contact" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-blue-500 transition shadow-md hover:shadow-blue-500/30">ติดต่อเรา</a>
                </div>

            </div>
        </div>
    </nav>

    <!-- Content หลัก -->
    <main class="flex-grow">
        <!-- Banner โปรโมท สไลด์เลื่อนอัตโนมัติ -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 my-8">
            <div class="relative overflow-hidden rounded-2xl shadow-2xl aspect-[16/9] md:aspect-[21/9] ring-1 ring-blue-900/10">
                
                <!-- Slide Containers -->
                <div id="slider" class="flex transition-transform duration-700 ease-out h-full">
                    <!-- รูปที่ 1 -->
                    <div class="w-full flex-shrink-0 relative">
                        <img src="https://cdn.phototourl.com/free/2026-07-27-22edce5f-4241-4ba6-b52d-a4c6af6c4c54.png" width="1000" Height="50">
                        <div class="absolute inset-0 bg-gradient-to-t from-blue-950/80 via-blue-950/30 to-transparent flex items-center justify-center">
                            <h2 class="text-white text-2xl md:text-5xl font-bold text-center px-4 drop-shadow-md"></h2>
                        </div>
                    </div>
                    <!-- รูปที่ 2 -->
                    <div class="w-full flex-shrink-0 relative">
                        <img src="https://cdn.phototourl.com/member/2026-07-27-89c366d0-0c5e-4e96-8ddb-d55f4fe50120.png" width="1000" Height="50">
                        <div class="absolute inset-0 bg-gradient-to-t from-blue-950/80 via-blue-950/30 to-transparent flex items-center justify-center">
                            <h2 class="text-white text-2xl md:text-5xl font-bold text-center px-4 drop-shadow-md"></h2>
                        </div>
                    </div>
                    <!-- รูปที่ 3 -->
                    <div class="w-full flex-shrink-0 relative">
                        <img src="https://cdn.phototourl.com/member/2026-07-27-e5ecdab4-392d-4435-bf76-ef7989782e88.png" width="1000" Height="50">
                        <div class="absolute inset-0 bg-gradient-to-t from-blue-950/80 via-blue-950/30 to-transparent flex items-center justify-center">
                            <h2 class="text-white text-2xl md:text-5xl font-bold text-center px-4 drop-shadow-md"></h2>
                        </div>
                    </div>
                </div>

                <!-- จุดบอกตำแหน่งสไลด์ (Dots) -->
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2">
                    <button class="dot h-3 rounded-full bg-white/50 transition-all duration-300 active-dot"></button>
                    <button class="dot h-3 rounded-full bg-white/50 transition-all duration-300"></button>
                    <button class="dot h-3 rounded-full bg-white/50 transition-all duration-300"></button>
                </div>

            </div>
        </section>

        <!-- โซนช่องทางติดต่อ (Social Media Links) -->
        <section id="contact" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 my-16 text-center">
            <h2 class="text-3xl font-bold text-blue-950 mb-2">ทำเว็บติดต่อเราได้ที่</h2>
            <p class="text-slate-500 mb-10">เลือกช่องทางที่คุณสะดวก แล้วทักหาเราได้เลยครับ</p>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-4xl mx-auto">
                
                

                <!-- Instagram -->
                <a href="https://www.instagram.com/chin_code.io?igsh=MXFlZTMxY3JrM2I3bA==" target="_blank" class="flex flex-col items-center p-6 bg-white rounded-2xl border border-blue-100 shadow-sm hover:shadow-xl hover:border-blue-300 transition-all duration-300 transform hover:-translate-y-1 group">
                    <div class="w-16 h-16 bg-pink-50 rounded-2xl flex items-center justify-center mb-4 group-hover:bg-gradient-to-tr group-hover:from-amber-500 group-hover:via-rose-500 group-hover:to-purple-600 transition-all duration-300">
                        <i class="fa-brands fa-instagram text-2xl text-pink-600 group-hover:text-white transition-colors duration-300"></i>
                    </div>
                    <span class="font-semibold text-slate-800 group-hover:text-pink-600 transition">Instagram</span>
                </a>

                <!-- Discord -->
                <a href="https://discord.gg/aMyXKBzad" target="_blank" class="flex flex-col items-center p-6 bg-white rounded-2xl border border-blue-100 shadow-sm hover:shadow-xl hover:border-blue-300 transition-all duration-300 transform hover:-translate-y-1 group">
                    <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mb-4 group-hover:bg-indigo-600 transition-colors duration-300">
                        <i class="fa-brands fa-discord text-2xl text-indigo-600 group-hover:text-white transition-colors duration-300"></i>
                    </div>
                    <span class="font-semibold text-slate-800 group-hover:text-indigo-600 transition">Discord</span>
                </a>

            </div>
        </section>
    </main>

    <!-- Footer: ด้านล่างสุด -->
    <footer class="bg-blue-950 text-blue-200 py-6 text-center text-sm border-t border-blue-900">
        <p>ยินดีให้บริการครับ</p>
    </footer>

    <!-- JavaScript สำหรับสไลด์เลื่อนอัตโนมัติ -->
    <script>
        const slider = document.getElementById('slider');
        const dots = document.querySelectorAll('.dot');
        let currentIndex = 0;
        const totalSlides = 3;

        function updateSlider() {
            slider.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach((dot, index) => {
                if(index === currentIndex) {
                    dot.classList.add('bg-white', 'w-6');
                    dot.classList.remove('bg-white/50', 'w-3');
                } else {
                    dot.classList.add('bg-white/50', 'w-3');
                    dot.classList.remove('bg-white', 'w-6');
                }
            });
        }

        setInterval(() => {
            currentIndex = (currentIndex + 1) % totalSlides;
            updateSlider();
        }, 3500);

        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                currentIndex = index;
                updateSlider();
            });
        });

        updateSlider();
    </script>
</body>
</html>
